[project]
name = "said"
version = "0.1.0"
description = "SAID - multi-agent scientific research assistant (V1)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "arxiv>=2.1.0",
    "ddgs>=9.0.0",
    "chromadb>=0.5.0",
]

[project.scripts]
said = "said.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/said"]
